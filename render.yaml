# Render deployment configuration
# Docs: https://render.com/docs/render-yaml

services:
  # ── Backend API (Express + Node.js) ─────────────────────────────────────────
  - type: web
    name: safestreet-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      # Set the following in Render Dashboard → Environment:
      # MONGO_URI, JWT_SECRET, JWT_EXPIRES_IN, CLIENT_ORIGIN,
      # EMAIL_USER, EMAIL_PASS, ADMIN_EMAIL

  # ── Frontend (Vite React) ────────────────────────────────────────────────────
  - type: web
    name: safestreet-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # SPA fallback — all routes serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
